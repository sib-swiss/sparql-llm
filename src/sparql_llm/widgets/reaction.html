<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      [hidden] {
        display: none !important;
      }
      .badge {
        font-size: 11px;
        padding: 1px 7px;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--muted);
      }
      .equation {
        margin: -4px 0 10px;
        font-size: 14px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .tabs button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .tabs label {
        display: flex;
        gap: 4px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      /* Depictions are drawn on white, also in dark mode */
      .panel {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
        overflow: auto;
      }
      #atommap svg {
        display: block;
        width: 100%;
        height: auto;
        max-height: 340px;
      }
      :root[data-mode="fullscreen"] #atommap svg {
        max-height: calc(100vh - 380px);
      }
      #atommap g.mol {
        cursor: pointer;
      }
      #atommap.no-color .outerglow {
        display: none;
      }
      #atommap.no-numbers .annotation {
        display: none;
      }
      #structures {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        color: #1f2328;
      }
      .mol-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 150px;
        padding: 4px;
        border: 2px solid transparent;
        border-radius: 8px;
        cursor: pointer;
        text-align: center;
        font-size: 12px;
      }
      .mol-card:hover,
      .mol-card.selected {
        border-color: #0969da;
      }
      .mol-card img {
        width: 130px;
        height: 130px;
        object-fit: contain;
      }
      .mol-card .noimg {
        width: 130px;
        height: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #656d76;
      }
      .op {
        font-size: 22px;
        color: #656d76;
        padding: 0 2px;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
        margin-top: 10px;
      }
      @media (max-width: 640px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      h2 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 8px;
      }
      .chips a {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 7px;
        font-size: 12px;
      }
      .list {
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      td,
      th {
        padding: 2px 8px;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 220px;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--panel);
        color: var(--muted);
        font-weight: 500;
      }
      tbody tr {
        cursor: pointer;
      }
      tbody tr:hover,
      tr.selected {
        background: var(--hover);
      }
      .enzyme-head {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 4px;
      }
      .enzyme-head input {
        flex: 1;
        min-width: 80px;
      }
      .details {
        margin-top: 10px;
        padding: 8px 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        min-height: 38px;
        overflow-wrap: anywhere;
      }
      .warn {
        color: #9a6700;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="logo" id="logo" title="Open in Rhea"><img src="logos/rhea.png" alt="Rhea" /></a>
      <h1 id="title">Loading reaction</h1>
      <span id="badges"></span>
      <span class="spacer"></span>
      <button type="button" id="fullscreen">Full screen</button>
    </header>
    <div class="equation" id="equation"></div>
    <div class="tabs">
      <button type="button" data-tab="atommap" class="active">Atom map</button>
      <button type="button" data-tab="structures">Structures</button>
      <span class="spacer"></span>
      <span id="map-options">
        <label><input id="color" type="checkbox" checked /> Color atoms</label>
        <label><input id="numbers" type="checkbox" checked /> Number atoms</label>
      </span>
      <span class="muted" id="confidence"></span>
    </div>
    <div class="panel" id="atommap"></div>
    <div class="panel" id="structures" hidden></div>
    <div class="grid">
      <div>
        <h2>EC numbers</h2>
        <div class="chips" id="ec"></div>
        <h2>Directions</h2>
        <div class="chips" id="directions"></div>
        <h2>Cross-references</h2>
        <div class="chips" id="xrefs"></div>
        <h2 id="pubmed-title">Publications</h2>
        <div class="chips" id="pubmed"></div>
      </div>
      <div>
        <div class="enzyme-head">
          <h2 id="enzymes-title">Enzymes</h2>
          <input id="filter" type="search" placeholder="Filter enzymes" />
        </div>
        <div class="list">
          <table>
            <thead>
              <tr>
                <th>Entry</th>
                <th>Gene</th>
                <th>Protein</th>
                <th>Organism</th>
              </tr>
            </thead>
            <tbody id="enzymes"></tbody>
          </table>
        </div>
        <div class="actions" id="enzyme-actions"></div>
      </div>
    </div>
    <div class="details muted" id="details">Click a molecule or an enzyme for details</div>

    <script src="colors.js"></script>
    <script src="viewers.js"></script>
    <script type="module">
      import {
        App,
        applyDocumentTheme,
        applyHostFonts,
        applyHostStyleVariables,
      } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@2.0.3/dist/src/app-with-deps.js";

      // Connection to the host with the MCP Apps SDK
      const app = new App(
        { name: "Rhea reaction", version: "0.0.1" },
        { availableDisplayModes: ["inline", "fullscreen"] },
      );
      const sendMessage = (text) => app.sendMessage({ role: "user", content: [{ type: "text", text }] });
      const updateContext = (text) => app.updateModelContext({ content: [{ type: "text", text }] });

      const $ = (id) => document.getElementById(id);
      const ARROWS = { none: "=", forward: "→", backward: "←", bi: "⇌" };
      const rheaUrl = (id) => `https://www.rhea-db.org/rhea/${id.replace("RHEA:", "")}`;
      const chebiUrl = (id) =>
        id.startsWith("CHEBI:")
          ? `https://www.ebi.ac.uk/chebi/${id}`
          : `https://www.rhea-db.org/rhea?query=${encodeURIComponent(id)}`;
      let data;
      let selected = null;
      let participants = [];

      const chip = (label, url, title = "") =>
        `<a ${url ? `data-url="${escapeHtml(url)}"` : ""} title="${escapeHtml(title)}">${escapeHtml(label)}</a>`;

      function renderStructures() {
        const card = (
          p,
          i,
        ) => `<div class="mol-card ${selected === p ? "selected" : ""}" data-i="${i}" title="${escapeHtml(p.chebiName ?? p.name)}">
            ${p.image ? `<img alt="${escapeHtml(p.name)}" src="${p.image}" />` : `<div class="noimg">${escapeHtml(p.formula ?? p.type)}</div>`}
            <div>${p.coef ? `<b>${escapeHtml(p.coef)}</b> ` : ""}${escapeHtml(p.name)}</div></div>`;
        const side = (ps, offset) => ps.map((p, i) => card(p, offset + i)).join(`<span class="op">+</span>`);
        $("structures").innerHTML =
          `${side(data.left, 0)}<span class="op">${ARROWS[data.direction] ?? "="}</span>${side(data.right, data.left.length)}`;
      }

      function renderEnzymes() {
        const text = $("filter").value.toLowerCase();
        const rows = data.enzymes.filter(
          (e) => !text || `${e.accession} ${e.id} ${e.gene} ${e.name} ${e.organism}`.toLowerCase().includes(text),
        );
        $("enzymes").innerHTML =
          rows
            .map(
              (e) => `<tr data-acc="${e.accession}" class="${selected?.accession === e.accession ? "selected" : ""}">
              <td>${e.accession}</td><td>${escapeHtml(e.gene ?? "")}</td>
              <td title="${escapeHtml(e.name)}">${escapeHtml(e.name ?? "")}</td>
              <td title="${escapeHtml(e.organism)}">${escapeHtml(e.organism ?? "")}</td></tr>`,
            )
            .join("") || `<tr><td class="muted" colspan="4">No reviewed enzyme in UniProtKB</td></tr>`;
      }

      function render() {
        $("title").textContent = data.id;
        $("logo").onclick = () => app.openLink({ url: rheaUrl(data.id) });
        $("badges").innerHTML = [
          data.direction === "none" ? "undefined direction" : data.direction,
          data.status,
          data.transport && "transport",
          !data.balanced && "not balanced",
        ]
          .filter(Boolean)
          .map((b) => `<span class="badge">${escapeHtml(b)}</span>`)
          .join(" ");
        $("equation").textContent = data.equation;
        // Atom map drawn by Rhea, already cleaned of scripts by the server
        if (data.atomMap) {
          $("atommap").innerHTML = data.atomMap;
          const low = data.confidence !== null && data.confidence < 0.5;
          $("confidence").innerHTML =
            data.confidence !== null
              ? `<span class="${low ? "warn" : ""}" title="RXNMapper confidence of the atom mapping">Confidence ${data.confidence.toFixed(2)}</span>`
              : "";
        } else {
          $("atommap").innerHTML =
            `<div style="color:#656d76">No atom map for this reaction (e.g. reactions with polymers)</div>`;
          showTab("structures");
        }
        renderStructures();
        $("ec").innerHTML =
          data.ec.map((e) => chip(`EC ${e.id}`, e.url, e.label)).join("") || `<span class="muted">None</span>`;
        $("directions").innerHTML = [
          chip(
            `${data.id} ${data.direction === "none" ? "undefined" : data.direction}`,
            rheaUrl(data.id),
            data.equation,
          ),
          ...data.directions.map((d) => chip(`${d.id} ${d.direction}`, rheaUrl(d.id), d.equation)),
        ].join("");
        $("xrefs").innerHTML =
          data.xrefs
            .map((x) => chip(`${x.type === "Gene Ontology" ? "" : `${x.type} `}${x.id}`, x.url, x.label))
            .join("") || `<span class="muted">None</span>`;
        $("pubmed-title").textContent = `Publications (${data.pubmed.length})`;
        $("pubmed").innerHTML = data.pubmed
          .slice(0, 30)
          .map((id) => chip(id, `https://pubmed.ncbi.nlm.nih.gov/${id}/`))
          .join("");
        $("enzymes-title").textContent = `Enzymes (${data.reviewedTotal} reviewed, ${data.unreviewedTotal} unreviewed)`;
        $("enzyme-actions").innerHTML =
          data.reviewedTotal + data.unreviewedTotal
            ? promptButton(
                "All enzymes in a table",
                `Search UniProtKB for \`rhea:${data.id.replace("RHEA:", "")}\` in a table`,
              )
            : "";
        renderEnzymes();
      }

      function showTab(tab) {
        for (const b of document.querySelectorAll("[data-tab]")) b.classList.toggle("active", b.dataset.tab === tab);
        $("atommap").hidden = tab !== "atommap";
        $("structures").hidden = tab !== "structures";
        $("map-options").hidden = tab !== "atommap" || !data?.atomMap;
        $("confidence").hidden = tab !== "atommap";
      }

      function selectParticipant(p) {
        selected = p;
        renderStructures();
        renderEnzymes();
        const side = data.left.includes(p) ? "reactant" : "product";
        $("details").classList.remove("muted");
        $("details").innerHTML = `
          <div><b>${escapeHtml(p.name)}</b> <a data-url="${escapeHtml(chebiUrl(p.id))}">${escapeHtml(p.id)}</a>
            <span class="muted">${side}${p.coef ? ` · coefficient ${escapeHtml(p.coef)}` : ""} · ${escapeHtml(p.type.toLowerCase().replace("_", " "))}</span></div>
          ${p.chebiName && p.chebiName !== p.name ? `<div class="muted">ChEBI name: ${escapeHtml(p.chebiName)}</div>` : ""}
          <div>${[p.formula && `Formula ${p.formula}`, p.charge !== null && `charge ${p.charge}`].filter(Boolean).map(escapeHtml).join(" · ")}</div>
          ${p.smiles ? `<div class="muted">SMILES ${escapeHtml(p.smiles)}</div>` : ""}
          ${p.inchikey ? `<div class="muted">InChIKey ${escapeHtml(p.inchikey)}</div>` : ""}
          <div class="actions">
            <button type="button" id="ask">Ask about it</button>
            ${chemicalButtons(p.id, p.name)}
          </div>`;
        $("ask").onclick = () =>
          sendMessage(`What is the role of ${p.name} (${p.id}) in the reaction ${data.id}: ${data.equation}?`);
        void updateContext(
          `The user selected the ${side} ${p.name} (${p.id}) of the Rhea reaction ${data.id}: ${data.equation}`,
        );
      }

      function selectEnzyme(e) {
        selected = e;
        renderStructures();
        renderEnzymes();
        $("details").classList.remove("muted");
        $("details").innerHTML = `
          <div><b>${escapeHtml(e.gene ?? e.id)}</b> ${escapeHtml(e.name ?? "")}
            <a data-url="https://www.uniprot.org/uniprotkb/${e.accession}/entry">${e.accession}</a></div>
          <div class="muted">${escapeHtml(e.organism ?? "")}</div>
          <div class="actions">
            <button type="button" id="ask">Ask about it</button>
            ${proteinButtons(e)}
          </div>`;
        $("ask").onclick = () =>
          sendMessage(
            `How does ${e.gene ?? e.id} (${e.accession}, ${e.organism}) catalyze ${data.id}: ${data.equation}?`,
          );
        void updateContext(
          `The user selected the enzyme ${e.accession} ${e.gene ?? ""} (${e.organism}) of the Rhea reaction ${data.id}`,
        );
      }

      for (const b of document.querySelectorAll("[data-tab]")) b.onclick = () => showTab(b.dataset.tab);
      $("color").onchange = () => $("atommap").classList.toggle("no-color", !$("color").checked);
      $("numbers").onchange = () => $("atommap").classList.toggle("no-numbers", !$("numbers").checked);
      $("filter").oninput = renderEnzymes;
      // Molecules of the atom map have their ChEBI ID as class
      $("atommap").addEventListener("click", (e) => {
        const mol = e.target.closest("g.mol");
        const id = mol && [...mol.classList].find((c) => c.includes(":"));
        const p = participants.find((p) => p.id === id);
        if (p) selectParticipant(p);
      });
      $("structures").addEventListener("click", (e) => {
        const card = e.target.closest(".mol-card");
        if (card) selectParticipant(participants[Number(card.dataset.i)]);
      });
      $("enzymes").addEventListener("click", (e) => {
        const tr = e.target.closest("tr[data-acc]");
        if (tr) selectEnzyme(data.enzymes.find((x) => x.accession === tr.dataset.acc));
      });
      document.body.addEventListener("click", (e) => {
        const { url, prompt } = e.target.closest("[data-url], [data-prompt]")?.dataset ?? {};
        if (url) void app.openLink({ url });
        if (prompt) void sendMessage(prompt);
      });
      // Theme and display mode of the host as attributes on <html> for the CSS
      function onContext(ctx) {
        if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
        if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
        if (ctx.theme) applyDocumentTheme(ctx.theme);
        if (ctx.displayMode) {
          document.documentElement.dataset.mode = ctx.displayMode;
          $("fullscreen").textContent = ctx.displayMode === "fullscreen" ? "Exit full screen" : "Full screen";
        }
      }
      app.onhostcontextchanged = onContext;
      // The host answers with the mode set, it may not send a context change
      $("fullscreen").onclick = async () => {
        const mode = document.documentElement.dataset.mode === "fullscreen" ? "inline" : "fullscreen";
        onContext({ displayMode: (await app.requestDisplayMode({ mode })).mode });
      };

      // Tool arguments, to call the tool again when the result has no `structuredContent`, as Claude Desktop
      // gives to widgets restored after a reload of the chat https://github.com/modelcontextprotocol/ext-apps/issues/696
      let toolArgs;
      app.ontoolinput = (params) => (toolArgs = params.arguments);
      app.ontoolresult = async (result) => {
        if (!result.structuredContent && !result.isError && toolArgs) {
          result = await app.callServerTool({ name: "show_reaction", arguments: toolArgs }).catch(() => result);
        }
        data = result.structuredContent;
        if (!data) return ($("title").textContent = "No reaction");
        participants = [...data.left, ...data.right];
        render();
        showTab(data.atomMap ? "atommap" : "structures");
      };

      await app.connect();
      // Full screen button only when the host offers it
      const host = app.getHostContext() ?? {};
      $("fullscreen").hidden = Boolean(
        host.availableDisplayModes && !host.availableDisplayModes.includes("fullscreen"),
      );
      onContext(host);
    </script>
  </body>
</html>
