<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      .layout {
        display: grid;
        grid-template-columns: 170px minmax(0, 1fr);
        gap: 12px;
      }
      @media (max-width: 560px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .layout.collapsed {
        grid-template-columns: minmax(0, 1fr);
      }
      .layout.collapsed .facets {
        display: none;
      }
      .facets {
        font-size: 12px;
        max-height: 430px;
        overflow-y: auto;
      }
      .facets h2 {
        font-size: 12px;
        margin: 8px 0 4px;
        color: var(--muted);
        font-weight: 600;
      }
      .facets h2:first-child {
        margin-top: 0;
      }
      .facets label {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 1px 0;
        cursor: pointer;
      }
      .facets label span:first-of-type {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .toolbar {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
      }
      .toolbar input {
        flex: 1;
        min-width: 0;
      }
      .scroll {
        max-height: 400px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      :root[data-mode="fullscreen"] .scroll,
      :root[data-mode="fullscreen"] .facets {
        max-height: calc(100vh - 150px);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        padding: 4px 6px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      /* Wrapped between words, so the columns are never narrower than their longest word */
      td.name,
      td.organism {
        white-space: normal;
        overflow-wrap: break-word;
      }
      /* Readable protein names before falling back to the compact table */
      .scroll:not(.compact) td.name {
        min-width: 140px;
      }
      td .inline {
        display: none;
      }
      /* Set by `fitTable` when all columns do not fit: first without the length, then compact with the gene under the
      entry and the organism under the protein name */
      .no-length .length,
      .compact .gene,
      .compact .organism,
      .compact .length {
        display: none;
      }
      .compact td .inline {
        display: block;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--panel);
        cursor: pointer;
        user-select: none;
        z-index: 1;
      }
      th[data-dir="asc"]::after {
        content: " \25B2";
      }
      th[data-dir="desc"]::after {
        content: " \25BC";
      }
      tbody tr:hover {
        background: var(--hover);
      }
      tr.selected {
        background: var(--hover);
      }
      .stars {
        color: #d4a72c;
        letter-spacing: -1px;
        font-size: 10px;
      }
      .selection {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 8px;
      }
      .selection input {
        flex: 1;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Loading results</h1>
      <span class="muted" id="subtitle"></span>
      <span class="spacer"></span>
      <button type="button" id="fullscreen">Full screen</button>
    </header>
    <div class="layout" id="layout">
      <div class="facets" id="facets"></div>
      <div>
        <div class="toolbar">
          <button type="button" id="toggle-facets" aria-expanded="true">Hide filters</button>
          <input id="filter" type="search" placeholder="Filter by accession, name, gene" />
        </div>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th data-col="selected"><input type="checkbox" id="all" aria-label="Select all shown" /></th>
                <th data-col="accession">Entry</th>
                <th data-col="gene" class="gene">Gene</th>
                <th data-col="name">Protein</th>
                <th data-col="organism" class="organism">Organism</th>
                <th data-col="length" class="length">Length</th>
                <th data-col="score">Score</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="selection">
      <span id="count" class="muted">No selection</span>
      <input id="prompt" placeholder="Compare these proteins" />
      <button type="button" class="primary" id="send" disabled>Send</button>
    </div>
    <div class="actions" id="viewers"></div>

    <script src="colors.js"></script>
    <script src="viewers.js"></script>
    <script type="module">
      import {
        App,
        applyDocumentTheme,
        applyHostFonts,
        applyHostStyleVariables,
      } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@2.0.3/dist/src/app-with-deps.js";

      // Connection to the host with the MCP Apps SDK
      const app = new App(
        { name: "UniProt results", version: "0.0.1" },
        { availableDisplayModes: ["inline", "fullscreen"] },
      );
      const sendMessage = (text) => app.sendMessage({ role: "user", content: [{ type: "text", text }] });
      const updateContext = (text) => app.updateModelContext({ content: [{ type: "text", text }] });

      const $ = (id) => document.getElementById(id);
      let rows = [];
      let data;
      const selected = new Set();
      // Facet values checked, none checked means no filter
      const facets = { reviewed: new Set(), organism: new Set(), score: new Set() };
      const facetValue = {
        reviewed: (r) => (r.reviewed ? "Reviewed (Swiss-Prot)" : "Unreviewed (TrEMBL)"),
        organism: (r) => r.organism ?? "Unknown",
        score: (r) => `${r.score}/5`,
      };
      let sort = { col: null, dir: 1 };

      const filtered = () => {
        const text = $("filter").value.toLowerCase();
        return rows.filter(
          (r) =>
            Object.entries(facets).every(([k, values]) => !values.size || values.has(facetValue[k](r))) &&
            (!text || `${r.accession} ${r.id} ${r.gene} ${r.name}`.toLowerCase().includes(text)),
        );
      };

      /** Facet values with their counts among the rows matching the other facets */
      function renderFacets() {
        const titles = { reviewed: "Status", score: "Annotation score", organism: "Organism" };
        $("facets").innerHTML = "";
        for (const key of ["reviewed", "score", "organism"]) {
          const others = rows.filter((r) =>
            Object.entries(facets).every(([k, v]) => k === key || !v.size || v.has(facetValue[k](r))),
          );
          const counts = Object.entries(Object.groupBy(others, facetValue[key])).map(([v, list]) => [v, list.length]);
          counts.sort((a, b) => (key === "score" ? b[0].localeCompare(a[0]) : b[1] - a[1]));
          $("facets").insertAdjacentHTML("beforeend", `<h2>${titles[key]}</h2>`);
          for (const [value, n] of counts.slice(0, key === "organism" ? 15 : undefined)) {
            const label = document.createElement("label");
            label.innerHTML = `<input type="checkbox" ${facets[key].has(value) ? "checked" : ""} />
              <span>${escapeHtml(value)}</span><span class="muted">${n}</span>`;
            label.querySelector("input").onchange = (e) => {
              e.target.checked ? facets[key].add(value) : facets[key].delete(value);
              render();
            };
            $("facets").append(label);
          }
        }
      }

      /** Most columns that fit in the width of the table, measured on the rows shown */
      function fitTable() {
        const scroll = document.querySelector(".scroll");
        for (const mode of ["full", "no-length", "compact"]) {
          scroll.classList.remove("no-length", "compact");
          if (mode !== "full") scroll.classList.add(mode);
          if (scroll.scrollWidth <= scroll.clientWidth) break;
        }
      }
      // Measured again when the width changes, not the height, which changes with the mode
      let tableWidth;
      new ResizeObserver(([e]) => {
        if (e.contentRect.width === tableWidth) return;
        tableWidth = e.contentRect.width;
        fitTable();
      }).observe(document.querySelector(".scroll"));

      function renderRows() {
        let list = filtered();
        if (sort.col) {
          const key = (r) => (sort.col === "selected" ? selected.has(r.accession) : (r[sort.col] ?? ""));
          list = [...list].sort((a, b) => {
            const [x, y] = [key(a), key(b)];
            return (typeof x === "string" ? x.localeCompare(y) : x - y) * sort.dir;
          });
        }
        $("rows").innerHTML = list
          .map(
            (r) => `<tr class="${selected.has(r.accession) ? "selected" : ""}" data-acc="${r.accession}">
              <td><input type="checkbox" ${selected.has(r.accession) ? "checked" : ""} aria-label="Select ${r.accession}" /></td>
              <td><a data-acc="${r.accession}">${r.accession}</a> <span title="${r.reviewed ? "Reviewed" : "Unreviewed"}">${r.reviewed ? "★" : "☆"}</span>
                <span class="inline">${escapeHtml(r.gene ?? "")}</span></td>
              <td class="gene">${escapeHtml(r.gene ?? "")}</td>
              <td class="name">${escapeHtml(r.name ?? "")}
                <span class="inline muted">${escapeHtml(r.organism ?? "")}</span></td>
              <td class="organism">${escapeHtml(r.organism ?? "")}</td>
              <td class="length">${r.length ?? ""}</td>
              <td class="stars" title="${r.score}/5">${"●".repeat(r.score)}</td></tr>`,
          )
          .join("");
        $("subtitle").textContent = `${list.length} of ${rows.length} loaded (${data.total} in UniProt)`;
        $("all").checked = list.length > 0 && list.every((r) => selected.has(r.accession));
        $("all").dataset.shown = JSON.stringify(list.map((r) => r.accession));
        fitTable();
      }

      function render() {
        renderFacets();
        renderRows();
        facetsToggleLabel();
      }

      /** Filter sidebar shown by default, collapsed to give the table the full width */
      function facetsToggleLabel() {
        const collapsed = $("layout").classList.contains("collapsed");
        const active = Object.values(facets).reduce((n, values) => n + values.size, 0);
        $("toggle-facets").textContent = collapsed ? `Filters${active ? ` (${active})` : ""}` : "Hide filters";
        $("toggle-facets").setAttribute("aria-expanded", String(!collapsed));
      }
      $("toggle-facets").onclick = () => {
        $("layout").classList.toggle("collapsed");
        facetsToggleLabel();
      };

      /** Selected rows, told to the model with the next message */
      function selectionChanged() {
        const list = rows.filter((r) => selected.has(r.accession));
        $("count").textContent = list.length ? `${list.length} selected` : "No selection";
        $("send").disabled = !list.length;
        renderViewers(list);
        const text = list.length
          ? `The user selected ${list.length} entries in the UniProt results table: ` +
            list.map((r) => `${r.accession} (${r.gene ?? r.id}, ${r.name}, ${r.organism})`).join("; ")
          : "The user has not selected entries in the UniProt results table";
        void updateContext(text);
      }

      /** Viewers of the selection: the protein views for one entry, the list views for entries of one organism */
      function renderViewers(list) {
        const organisms = new Set(list.map((r) => r.organism));
        $("viewers").innerHTML =
          list.length === 1
            ? `<span class="muted">Open ${escapeHtml(proteinLabel(list[0]))} in:</span>${proteinButtons(list[0])}`
            : list.length > 1 && organisms.size === 1
              ? `<span class="muted">Open the ${list.length} entries in:</span>` +
                listButtons(
                  list.map((r) => r.gene ?? r.accession),
                  list[0].organism,
                )
              : "";
      }

      $("rows").addEventListener("click", (e) => {
        const link = e.target.closest("a[data-acc]");
        if (link) return void app.openLink({ url: `https://www.uniprot.org/uniprotkb/${link.dataset.acc}/entry` });
        const tr = e.target.closest("tr");
        if (!tr) return;
        const acc = tr.dataset.acc;
        selected.has(acc) ? selected.delete(acc) : selected.add(acc);
        tr.classList.toggle("selected", selected.has(acc));
        tr.querySelector("input").checked = selected.has(acc);
        selectionChanged();
      });
      $("all").onclick = (e) => {
        e.stopPropagation();
        for (const acc of JSON.parse($("all").dataset.shown ?? "[]"))
          e.target.checked ? selected.add(acc) : selected.delete(acc);
        renderRows();
        selectionChanged();
      };
      document.querySelector("thead").addEventListener("click", (e) => {
        const th = e.target.closest("th");
        if (!th || e.target.id === "all") return;
        sort = { col: th.dataset.col, dir: sort.col === th.dataset.col ? -sort.dir : 1 };
        for (const h of document.querySelectorAll("th")) delete h.dataset.dir;
        th.dataset.dir = sort.dir > 0 ? "asc" : "desc";
        renderRows();
      });
      $("filter").oninput = renderRows;
      $("viewers").addEventListener("click", (e) => {
        const prompt = e.target.closest("[data-prompt]")?.dataset.prompt;
        if (prompt) void sendMessage(prompt);
      });
      $("send").onclick = () => {
        const list = rows.filter((r) => selected.has(r.accession));
        const prompt = $("prompt").value.trim() || "Compare these proteins";
        void sendMessage(`${prompt}: ${list.map((r) => `${r.accession} (${r.gene ?? r.id})`).join(", ")}`);
        $("prompt").value = "";
      };
      // Block body: a handler returning false would cancel every key typed
      $("prompt").onkeydown = (e) => {
        if (e.key === "Enter" && !$("send").disabled) $("send").click();
      };
      // Theme and display mode of the host as attributes on <html> for the CSS
      function onContext(ctx) {
        if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
        if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
        if (ctx.theme) applyDocumentTheme(ctx.theme);
        if (ctx.displayMode) {
          document.documentElement.dataset.mode = ctx.displayMode;
          $("fullscreen").textContent = ctx.displayMode === "fullscreen" ? "Exit full screen" : "Full screen";
        }
      }
      app.onhostcontextchanged = onContext;
      // The host answers with the mode set, it may not send a context change
      $("fullscreen").onclick = async () => {
        const mode = document.documentElement.dataset.mode === "fullscreen" ? "inline" : "fullscreen";
        onContext({ displayMode: (await app.requestDisplayMode({ mode })).mode });
      };

      // Tool arguments, to call the tool again when the result has no `structuredContent`, as Claude Desktop
      // gives to widgets restored after a reload of the chat https://github.com/modelcontextprotocol/ext-apps/issues/696
      let toolArgs;
      app.ontoolinput = (params) => (toolArgs = params.arguments);
      app.ontoolresult = async (result) => {
        if (!result.structuredContent && !result.isError && toolArgs) {
          result = await app.callServerTool({ name: "search_proteins_table", arguments: toolArgs }).catch(() => result);
        }
        data = result.structuredContent;
        if (!data) return ($("title").textContent = "No results");
        rows = data.rows;
        $("title").textContent = data.query;
        render();
      };

      await app.connect();
      // Full screen button only when the host offers it
      const host = app.getHostContext() ?? {};
      $("fullscreen").hidden = Boolean(
        host.availableDisplayModes && !host.availableDisplayModes.includes("fullscreen"),
      );
      onContext(host);
    </script>
  </body>
</html>
